name: agora # Compose 项目名，同时作为容器、网络和数据卷的命名前缀
services:
  # ================== MySQL 数据库服务 ==================
  mysql: # 对应一个容器/进程/服务，服务名叫 mysql。其他容器可以直接通过 mysql:3306 访问它，mysql 会被 Docker 内置 DNS 解析到该服务容器的 IP。
    image: mysql:8.0   # 使用 MySQL 8.0 官方镜像
    restart: always    # 容器退出或电脑重启后自动重新启动
    networks:          # 加入项目内部网络，供 API 和 Worker 通过服务名 mysql 访问
      - agora_network
    environment: #读取.env中的环境变量
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      - MYSQL_DATABASE=${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      - MYSQL_USER=${MYSQL_USER:?MYSQL_USER is required}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      - TZ=Asia/Shanghai   # 时区设为上海
    ports:
      - "3306:3306"  # 0.0.0.0:3306:3306 监听服务器的所有 IPv4 网卡地址
    volumes:
      - mysql_data:/var/lib/mysql   # 数据卷：MySQL数据存到mysql_data卷，容器删除数据也不丢
    healthcheck:   # 健康检查：容器报告"健康"才算真正启动完成
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]  # 用mysqladmin ping测连通
      interval: 5s   # 每5秒检查一次
      timeout: 5s    # 单次检查超时5秒
      retries: 20    # 连续20次失败判定为不健康


  # ================== Redis 缓存服务 ==================
  redis:
    image: redis:7-alpine   # Redis 7 精简版镜像（alpine体积小）
    restart: always
    networks:
      - agora_network   # 容器内部使用 redis:6379 访问
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data   # 数据卷：Redis持久化数据存到redis_data卷
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]  # 带密码ping测连通
      interval: 5s
      timeout: 3s
      retries: 20


  # ================== RabbitMQ 消息队列服务 ==================
  rabbitmq:
    image: rabbitmq:3-management   # RabbitMQ 3.x + 管理界面版
    restart: always
    networks:
      - agora_network   # 容器内部使用 rabbitmq:5672 访问
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?RABBITMQ_USER is required}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:?RABBITMQ_PASS is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq   # 数据卷：队列数据持久化
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]  # 诊断命令测连通
      interval: 5s
      timeout: 5s
      retries: 20


  # ================== 三个 Go API 实例 ==================
  # 每个 API 都有独立的进程内缓存和 distcache 地址；节点列表保持一致。
  api1: &api_service  # 把 api1 这一整套配置保存成一个可复制模板，名字叫 api_service
    build:  # 构建镜像
      context: .   #构建上下文
      dockerfile: backend/Dockerfile  #指定Dockerfile路径
      target: api  # 多阶段构建，构建到 api 阶段，生成运行 API 程序的镜像
    restart: always
    networks:
      - agora_network
    environment: &api_environment
      CONFIG_PATH: /app/config/config.json
      GIN_MODE: ${GIN_MODE:-release}  #Compose 先尝试从服务器 .env 读取，没有就使用release
      GIN_ACCESS_LOG: ${GIN_ACCESS_LOG:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
      TRUSTED_PROXIES: 172.30.0.0/24
      DISTCACHE_ADDR: api1:9001
      DISTCACHE_NODES: api1:9001,api2:9001,api3:9001
      MIGRATE_ON_START: "true" # api1 启动时执行数据库表结构迁移
    ports:
      - "127.0.0.1:6060:6060"
    expose: # 声明和说明服务使用哪些内部端口，尽说明用
      - "8080"
      - "9001"
    volumes:
      - backend_uploads:/app/.run/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: &api_healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 3

  api2:
    <<: *api_service  # 复制配置
    environment:
      <<: *api_environment  # 改动一小部分也会把整个替换，所以需要特地复制环境变量
      DISTCACHE_ADDR: api2:9001
      MIGRATE_ON_START: "false"
    ports:
      - "127.0.0.1:6061:6060"
    depends_on:
      api1:
        condition: service_healthy

  api3:
    <<: *api_service
    environment:
      <<: *api_environment
      DISTCACHE_ADDR: api3:9001
      MIGRATE_ON_START: "false"
    ports:
      - "127.0.0.1:6062:6060"
    depends_on:
      api1:
        condition: service_healthy

  # Nginx 是宿主机唯一 HTTP 入口，将请求分散到三个 API。
  gateway:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: always
    networks:
      - agora_network
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro # 绑定挂载，容器内只能读取，不能修改宿主机上的文件
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ================== Go 后端 Worker 进程（异步消费MQ） ==================
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker   # 构建worker目标阶段
    restart: always
    networks:
      - agora_network
    environment:
      CONFIG_PATH: /app/config/config.json
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_PASS: ${RABBITMQ_PASS:?RABBITMQ_PASS is required}
    ports:
      - "127.0.0.1:6063:6060" # Worker pprof，仅宿主机可访问
    depends_on:   # worker也等三个中间件健康后再启动
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]  # PID 1 就是 worker 进程
      interval: 15s
      timeout: 5s
      retries: 3

# ================== 数据卷定义 ==================
# 数据卷让容器数据持久化：容器删除后数据保留，下次启动重新挂载
volumes:
  mysql_data:     # MySQL数据
  redis_data:     # Redis持久化数据
  rabbitmq_data:  # RabbitMQ队列数据
  backend_uploads:  # 后端上传的内容资源

# ================== 网络定义 ==================
# bridge 网络只在本机 Docker 中使用；同一网络内的容器可通过服务名互相访问
networks:
  agora_network: # 创建网络
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
