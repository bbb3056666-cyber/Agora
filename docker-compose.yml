name: agora # Compose 项目名，同时作为容器、网络和数据卷的命名前缀
services:
  # ================== MySQL 数据库服务 ==================
  mysql:
    image: mysql:8.0   # 使用 MySQL 8.0 官方镜像
    restart: always    # 容器退出或电脑重启后自动重新启动
    networks:
      - agora_network   # 加入项目内部网络，供 API 和 Worker 通过服务名 mysql 访问
    environment:
      # 环境变量：root密码。${MYSQL_ROOT_PASSWORD:-123456} 表示读.env里的MYSQL_ROOT_PASSWORD，:-表示没设置就用默认123456
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-123456}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agora}
      - TZ=Asia/Shanghai   # 时区设为上海
    ports:
      - "3306:3306"   # 宿主机3306 → 容器3306
    volumes:
      - mysql_data:/var/lib/mysql   # 数据卷：MySQL数据存到mysql_data卷，容器删除数据也不丢
    command:   # 容器内执行的命令和参数
      - mysqld
      - --default-authentication-plugin=mysql_native_password  # 兼容旧版认证方式
      - --character-set-server=utf8mb4   # 字符集utf8mb4（支持emoji）
      - --collation-server=utf8mb4_0900_ai_ci  # 排序规则
    healthcheck:   # 健康检查：容器报告"健康"才算真正启动完成
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]  # 用mysqladmin ping测连通
      interval: 5s   # 每5秒检查一次
      timeout: 5s    # 单次检查超时5秒
      retries: 20    # 连续20次失败判定为不健康
#docker run -d \
  #  --name mysql \
  #  -e MYSQL_ROOT_PASSWORD=123456 \
  #  -e MYSQL_DATABASE=agora \
  #  -e TZ=Asia/Shanghai \
  #  -p 3307:3306 \
  #  -v mysql_data:/var/lib/mysql \
  #  --restart always \
  #  mysql:8.0 \
  #  mysqld \
  #  --default-authentication-plugin=mysql_native_password \
  #  --character-set-server=utf8mb4 \
  #  --collation-server=utf8mb4_0900_ai_ci

  # ================== Redis 缓存服务 ==================
  redis:
    image: redis:7-alpine   # Redis 7 精简版镜像（alpine体积小）
    restart: always
    networks:
      - agora_network   # 容器内部使用 redis:6379 访问
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-123456}   # Redis密码，默认123456
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-123456}"]  # 覆盖启动命令：开启AOF持久化+设置密码
    ports:
      - "6379:6379"   # 宿主机6379 → 容器6379
    volumes:
      - redis_data:/data   # 数据卷：Redis持久化数据存到redis_data卷
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]  # 带密码ping测连通
      interval: 5s
      timeout: 3s
      retries: 20

  # ================== RabbitMQ 消息队列服务 ==================
  rabbitmq:
    image: rabbitmq:3-management   # RabbitMQ 3.x + 管理界面版
    restart: always
    networks:
      - agora_network   # 容器内部使用 rabbitmq:5672 访问
    ports:
      - "5672:5672"     # AMQP协议端口（后端程序连接用）
      - "15672:15672"   # 管理界面端口（浏览器访问 http://localhost:15672）
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}        # 默认用户名，默认admin
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-password123}  # 默认密码
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq   # 数据卷：队列数据持久化
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]  # 诊断命令测连通
      interval: 5s
      timeout: 5s
      retries: 20

  # ================== Go 后端 API 服务 ==================
  backend:
    build:   # 用Dockerfile构建镜像，而不是拉现成镜像
      context: .   # 构建上下文目录（当前目录，能访问backend/等）
      dockerfile: backend/Dockerfile   # 指定Dockerfile路径
      target: api   # 构建目标阶段：api（Dockerfile里多阶段构建，只构建api目标）
    restart: always
    networks:
      - agora_network
    environment:   # 传给容器的环境变量，覆盖config.yaml里的配置
      CONFIG_PATH: /app/configs/config.docker.json   # 容器内的配置文件路径
      GIN_MODE: ${GIN_MODE:-release}
      GIN_ACCESS_LOG: ${GIN_ACCESS_LOG:-false}
      JWT_SECRET: ${JWT_SECRET:-agora-dev-secret-key}   # JWT密钥
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agora}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-password123}
    ports:
      - "8080:8080"   # 宿主机8080 → 容器8080，对外提供HTTP API
      - "127.0.0.1:6060:6060" # API pprof，仅宿主机可访问
    volumes:
      - backend_uploads:/app/.run/uploads   # 上传的视频文件持久化到卷
    depends_on:   # 依赖关系：等依赖服务健康后才启动backend
      mysql:
        condition: service_healthy   # MySQL健康后才启动
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]  # 请求健康检查接口
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 3

  # ================== Go 后端 Worker 进程（异步消费MQ） ==================
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker   # 构建worker目标阶段
    restart: always
    networks:
      - agora_network
    environment:
      CONFIG_PATH: /app/configs/config.docker.json
      JWT_SECRET: ${JWT_SECRET:-agora-dev-secret-key}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agora}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-password123}
    ports:
      - "127.0.0.1:6061:6061" # Worker pprof，仅宿主机可访问
    depends_on:   # worker也等三个中间件健康后再启动
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]  # PID 1 就是 worker 进程
      interval: 15s
      timeout: 5s
      retries: 3

# ================== 数据卷定义 ==================
# 数据卷让容器数据持久化：容器删除后数据保留，下次启动重新挂载
volumes:
  mysql_data:     # MySQL数据
  redis_data:     # Redis持久化数据
  rabbitmq_data:  # RabbitMQ队列数据
  backend_uploads:  # 后端上传的内容资源

# ================== 容器网络定义 ==================
# bridge 网络只在本机 Docker 中使用；同一网络内的容器可通过服务名互相访问
networks:
  agora_network:
    driver: bridge
